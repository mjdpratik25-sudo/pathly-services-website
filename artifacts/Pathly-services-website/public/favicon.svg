<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad" x1="20" y1="20" x2="90" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FF7A50" />
      <stop offset="50%" stopColor="#E7552A" />
      <stop offset="100%" stopColor="#CE3F18" />
    </linearGradient>

    <linearGradient id="pinGrad" x1="100" y1="35" x2="135" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#3B82F6" />
      <stop offset="60%" stopColor="#1D4ED8" />
      <stop offset="100%" stopColor="#1E3A8A" />
    </linearGradient>
  </defs>

  <!-- Stylized P -->
  <path
    d="M 36 122 L 36 26 C 36 26 84 20 84 56 C 84 90 36 90 36 90"
    fill="none"
    stroke="url(#pGrad)"
    stroke-width="15"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Dotted Navigation Trail -->
  <path
    d="M 68 90 C 86 98 98 94 108 82"
    fill="none"
    stroke="#EAB308"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-dasharray="1 11"
  />

  <!-- Modern Blue Navigation Pin -->
  <g>
    <path
      d="M 120 40 C 133 40 144 51 144 64 C 144 80 120 106 120 106 C 120 106 96 80 96 64 C 96 51 107 40 120 40 Z"
      fill="url(#pinGrad)"
    />
    <circle cx="120" cy="63" r="6" fill="#FFFFFF" />
  </g>
</svg>
